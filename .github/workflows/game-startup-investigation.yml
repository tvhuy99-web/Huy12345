name: Investigate Zetianji startup in isolated Wine
on:
  push:
    branches: [codex/game-startup-investigation]
    paths: ['runtime-nvda/game-analysis/**', '.github/workflows/game-startup-investigation.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: game-startup-investigation
  cancel-in-progress: true
jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 89f4d28f0be76f93e1f7bc6871f40893c798a1f6
          path: candidate
          persist-credentials: false
          sparse-checkout: runtime-nvda
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install archive inspection tools
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::ForceIPv4=true install -y --no-install-recommends unrar libarchive-tools gcc-mingw-w64-x86-64-posix gcc-mingw-w64-i686-posix
          python -m pip install gdown pefile rarfile cryptography
      - name: Download the exact user-supplied game
        timeout-minutes: 12
        run: |
          mkdir -p "$RUNNER_TEMP/game-analysis" results/static
          gdown 'https://drive.google.com/uc?id=1drjUVlzfTue5eH3azSaCkuuW4IFTwB74' -O "$RUNNER_TEMP/game-analysis/game.rar" --continue
          python -c 'import os; assert os.path.getsize(os.environ["RUNNER_TEMP"]+"/game-analysis/game.rar")==1529767694'
      - name: Inspect archive, game error logs and PE dependencies
        run: python runtime-nvda/game-analysis/static.py "$RUNNER_TEMP/game-analysis/game.rar" "$RUNNER_TEMP/game-analysis/extracted" results/static
      - name: Upload static findings without the game binaries
        uses: actions/upload-artifact@v4
        with:
          name: zetianji-static-findings
          path: results/static/
      - name: Get the already-tested NVDA bundle
        uses: actions/download-artifact@v4
        with:
          name: nvda-bundle
          run-id: 40990170367
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/game-analysis/nvda
      - name: Use the exact candidate integration sources with the pinned NVDA runtime
        run: |
          cp candidate/runtime-nvda/winlatorStartup.py "$RUNNER_TEMP/game-analysis/nvda/winlatorStartup.py"
          cp candidate/runtime-nvda/game_voice.py "$RUNNER_TEMP/game-analysis/nvda/game_voice.py"
          cp candidate/runtime-nvda/manifest.ini "$RUNNER_TEMP/game-analysis/nvda/addon-manifest.ini"
          cp candidate/runtime-nvda/voice-trace-original.json "$RUNNER_TEMP/game-analysis/nvda/voice-trace-original.json"
          python - <<'BUILD'
          import sys,os
          sys.path.insert(0,'candidate/runtime-nvda')
          from build_voice_trace import build
          build(os.environ['RUNNER_TEMP']+'/game-analysis/nvda/voice-trace-x86.dll')
          BUILD
      - name: Compile diagnostic observer and prepare isolated Wine image
        run: |
          i686-w64-mingw32-gcc -O2 -Wall -Wextra -Werror -static runtime-nvda/game-analysis/probe.c -lwinmm -lgdi32 -o runtime-nvda/game-analysis/probe.exe
          i686-w64-mingw32-gcc -O2 -Wall -Wextra -Werror -static runtime-nvda/game-analysis/tts-probe.c -o runtime-nvda/game-analysis/tts-probe.exe
          i686-w64-mingw32-gcc -O2 -Wall -Wextra -Werror -static runtime-nvda/game-analysis/stack-probe.c -o runtime-nvda/game-analysis/stack-probe.exe
          docker build -t zetianji-wine-probe runtime-nvda/game-analysis
      - name: Verify the game with the optional voice recorder
        timeout-minutes: 18
        run: |
          python runtime-nvda/game-analysis/host.py "$RUNNER_TEMP/game-analysis" results
      - name: Upload bounded diagnostic findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zetianji-startup-findings
          path: results/
          if-no-files-found: warn
