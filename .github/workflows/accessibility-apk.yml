          - tắt ANDROID_ASERVER_USE_SHM để buộc plugin ALSA phía Wine gửi PCM trực tiếp qua Unix socket;
          - Android kiểm tra toàn bộ byte của mỗi gói PCM thay vì chỉ 4 KiB đầu;
          - giữ nguyên driver ALSA, latency, volume, CP936, bản sửa CPU và toàn bộ log game.voice/audio.alsa.
          
          Nếu socket có nonZeroSampleBytes > 0 hoặc nghe được tiếng, lỗi nằm ở shared-memory bridge. Nếu socket vẫn toàn 0, lỗi nằm trước ALSA, nhiều khả năng ở mixer/resource/BASS/DirectSound/OpenAL của game.
          Chữ ký chỉ được kiểm tra/phát hành từ nhánh codex/accessibility-apk.
          ZH_CN_NOTES
          fi
          printf '\nBuild: %s/%s/actions/runs/%s\nCommit: %s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" >> /tmp/preview-notes.md
          gh release create "$tag" Winlator-VI-NVDA.apk Winlator-VI-NVDA.apk.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "$title" --notes-file /tmp/preview-notes.md
