name: Build Vietnamese accessibility APK

on:
  push:
    branches: [codex/accessibility-apk, 'diagnostics/zetianji-audio-20261031', 'experiment/zetianji-audio-socket-20261031']
    paths: ['app/**', 'runtime-accessibility/**', 'runtime-nvda/**', '.github/workflows/accessibility-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: accessibility-apk-apk66-${{ github.ref }}
  cancel-in-progress: true
# CP936 branch verification: keep one newest run active; newer commits intentionally cancel older runs.

jobs:
  wine-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: app/app/src/main/assets/nvda
          key: nvda-portable-2026.3-a8a87cb8-v1
      - name: Install Windows compiler and Wine test environment
        timeout-minutes: 10
        run: |
          sudo dpkg --add-architecture i386
          sudo sed -i 's/^Architectures: amd64$/Architectures: amd64 i386/' /etc/apt/sources.list.d/ubuntu.sources
          sudo timeout 120s apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends gcc-mingw-w64-x86-64-posix gcc-mingw-w64-i686-posix wine64 wine32:i386 xvfb xauth fonts-wine p7zip-full pulseaudio xdotool
      - name: Compile the Wine helper from source
        run: |
          bash runtime-accessibility/build.sh
          x86_64-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror -mwindows -static -static-libgcc runtime-nvda/touch-fixture.c -lcomctl32 -lcomdlg32 -o runtime-nvda/touch-fixture.exe
      - name: Exercise real Windows controls under Wine
        run: xvfb-run -a python3 runtime-accessibility/test_wine.py
      - name: Prepare bundled NVDA and compile its launcher
        run: |
          python3 runtime-nvda/test_diagnostics.py
          python3 runtime-nvda/test_game_voice.py
          python3 runtime-nvda/test_game_startup.py
          python3 runtime-nvda/build_voice_trace.py
          xvfb-run -a python3 runtime-nvda/test_voice_trace_wine.py
          xvfb-run -a python3 runtime-nvda/test_game_probe_wine.py
          python3 runtime-nvda/prepare.py
          python3 runtime-nvda/compat.py
          bash runtime-nvda/build.sh
          python3 runtime-nvda/wfm/build.py
      - name: Verify NVDA initialization and speech audio in Wine
        run: |
          pulseaudio --start --exit-idle-time=-1
          xvfb-run -a python3 runtime-nvda/probe.py --require-ready
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvda-startup-test-results
          path: runtime-nvda/probe-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: nvda-bundle
          path: app/app/src/main/assets/nvda/
          if-no-files-found: error
      - name: Upload Wine diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-accessibility-test-log
          path: runtime-accessibility/wine-test.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: wine-accessibility-helper
          path: app/app/src/main/assets/accessibility/winlator-a11y.exe
          if-no-files-found: error
  build:
    needs: wine-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WINLATOR_PREVIEW_KEYSTORE: ${{ github.workspace }}/.preview-signing/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wine-accessibility-helper
          path: app/app/src/main/assets/accessibility/
      - uses: actions/download-artifact@v4
        with:
          name: nvda-bundle
          path: app/app/src/main/assets/nvda/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;24.0.8215888' 'cmake;3.22.1'
      - name: Keep preview signing identity across builds
        uses: actions/cache@v4
        with:
          path: .preview-signing/debug.keystore
          key: winlator-accessibility-debug-signing-v2
      - name: Create preview key only when no cached key exists
        run: |
          mkdir -p "$(dirname "$WINLATOR_PREVIEW_KEYSTORE")"
          if [ ! -f "$WINLATOR_PREVIEW_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$WINLATOR_PREVIEW_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Winlator Accessibility Preview,O=Android,C=VN' -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          fi
      - name: Test Android accessibility and build APK
        working-directory: app
        run: bash gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Verify automated test results
        run: |
          python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as E
          results = [E.parse(p).getroot() for p in glob.glob('app/app/build/test-results/testDebugUnitTest/TEST-*.xml')]
          tests = sum(int(x.get('tests', 0)) for x in results)
          failures = sum(int(x.get('failures', 0)) + int(x.get('errors', 0)) for x in results)
          assert tests >= 123 and failures == 0, (tests, failures)
          print(f'{tests} automated tests passed; {failures} failures')
          PYTEST
      - name: Verify that the APK includes the tested Windows helper
        run: |
          python3 - <<'PYAPK'
          import hashlib, pathlib, zipfile
          helper = pathlib.Path('app/app/src/main/assets/accessibility/winlator-a11y.exe').read_bytes()
          with zipfile.ZipFile('app/app/build/outputs/apk/debug/app-debug.apk') as apk:
              packaged = apk.read('assets/accessibility/winlator-a11y.exe')
              import json
              nvda = apk.read('assets/nvda/nvda-portable.zip')
              metadata = json.loads(apk.read('assets/nvda/manifest.json'))
              assert hashlib.sha256(nvda).hexdigest() == metadata['archiveSha256']
              assert metadata['winlatorCompatibilityVersion'] == 5
              assert apk.read('assets/nvda/nvda-launcher.exe').startswith(b'MZ')
              wfm = apk.read('assets/nvda/wfm.exe')
              wfm_meta = json.loads(apk.read('assets/nvda/wfm-build.json'))
              assert wfm.startswith(b'MZ') and hashlib.sha256(wfm).hexdigest() == wfm_meta['binarySha256']
              assert wfm_meta['commandProtocol'] == 3 and wfm_meta['selectedPathProtocol'] == 1
              assert not any('winlatorTestGuard' in name or 'test_no_injection_plugin' in name or 'wfm-delayed-test' in name for name in apk.namelist())
              assert apk.read('assets/nvda/game_startup.py') == pathlib.Path('runtime-nvda/game_startup.py').read_bytes()
              assert b'class SynthDriver' in apk.read('assets/nvda/winlatorAndroid.py')
              assert apk.read('assets/nvda/voice-trace-x86.dll') == pathlib.Path('app/app/src/main/assets/nvda/voice-trace-x86.dll').read_bytes()
              assert apk.read('assets/nvda/game-probe-x86.exe') == pathlib.Path('app/app/src/main/assets/nvda/game-probe-x86.exe').read_bytes()
              assert apk.read('assets/nvda/game-audio-loader-x86.exe') == pathlib.Path('app/app/src/main/assets/nvda/game-audio-loader-x86.exe').read_bytes()
              assert json.loads(apk.read('assets/nvda/voice-trace-original.json'))['sha256'] == '54ce75b5c6441d739ad08a99876cea5bc52b3a91b7498ba21bc7b3f26b3265e3'
          assert helper.startswith(b'MZ') and packaged == helper
          print('APK includes the tested Windows helper:', hashlib.sha256(helper).hexdigest())
          PYAPK
      - name: Verify APK signature matches the APK 52 update key
        if: github.ref_name == 'codex/accessibility-apk'
        run: |
          set -euo pipefail
          apk='app/app/build/outputs/apk/debug/app-debug.apk'
          expected='b737701c78116041aac816c3f8d6606aec9b0d09a44659d879ee2d8bb4ba9bd1'
          output="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$output"
          actual="$(printf '%s\n' "$output" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}')"
          test -n "$actual"
          if [ "$actual" != "$expected" ]; then
            echo "Refusing to publish: APK signer $actual does not match APK 52 signer $expected" >&2
            exit 1
          fi
          echo "APK signer matches APK 52: $actual"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-test-results
          path: app/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-VI-accessibility
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK preview for phone download
        if: github.ref_name == 'codex/accessibility-apk'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/app/build/outputs/apk/debug/app-debug.apk Winlator-VI-NVDA.apk
          sha256sum Winlator-VI-NVDA.apk > Winlator-VI-NVDA.apk.sha256
          tag="nvda-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cat > /tmp/preview-notes.md <<'NOTES'
          Bản 52 có bản sửa khởi động cho đúng tệp Zetianji đã phân tích. Nhật ký OnePlus bản 51 ghi luồng giao diện chờ tại Sleep, trở về RVA 0x18ed09. Mã gốc có vòng chờ 800 ms lặp mãi khi bộ đếm CPU nhàn rỗi vẫn bằng 0. Bản sửa cho trường hợp này trở về nhánh lỗi -1 đã có sẵn trong hàm đo CPU, để khởi tạo có thể tiếp tục. Nhánh bộ đếm hợp lệ giữ phép tính gốc.

          Chỉ nhận zetianji.exe có SHA-256 gốc 678d22fbf2383bf4f8fedb9fc3bb04be7771a051fa65f2d8820943880aa2089d. Thay đổi hai vùng mã có tổng 21 byte, không đổi kích thước tệp. Sao lưu nguyên bản trước khi sửa; kiểm tra SHA-256 khi áp dụng lại hoặc khôi phục. Tệp khác phiên bản hoặc có chỉnh sửa khác sẽ bị từ chối. Không ghi đè khi phát hiện game trong cùng thư mục còn chạy.

          Cài cập nhật cùng chữ ký. Thoát môi trường cũ, mở lại và chọn zetianji.exe nhưng chưa mở game. Vào Chẩn đoán game → Sửa lỗi khởi động game, chờ báo đã sửa rồi mở game. Có mục Khôi phục tệp game gốc. Bộ ghi giọng đã chuẩn bị từ bản trước vẫn dùng được. Nếu game chưa hiện hoặc chưa đọc, chờ khoảng một phút rồi Chia sẻ nhật ký công cụ.

          Nhật ký vẫn tối đa 500.000 ký tự và tự xóa bản cũ. Đây là bản sửa có phạm vi cụ thể, chưa xác nhận mọi chức năng/gameplay đều hoạt động trên Android/Box64. Người dùng tự bật/tắt TalkBack.
          NOTES
          title='Winlator 52 — sửa vòng chờ bộ đếm CPU khi mở Zetianji'
          if grep -q 'versionCode 71' app/app/build.gradle; then
            tag="nvda-game-menu-aisound-result-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
            title='Winlator 71: tìm nguyên nhân game không có menu và tiếng'
            cat > /tmp/preview-notes.md <<'MENU71_NOTES'
          Nhật ký APK 70 cho thấy game gọi InitTTS nhưng chỉ một dòng
          hướng dẫn trong ListBox lặp lại khi dùng mũi tên; BASS ba lần
          nhận con trỏ NULL và ALSA chuyển dữ liệu toàn số 0.
          Bản 71 đo giá trị trả về InitTTS và thời gian gọi hàm,
          kiểm tra số mục ListBox thực sự bằng LB_GETCOUNT/LB_GETCURSEL
          khi foreground là Zetianji, ghi game.menu.state và thông báo
          rõ nếu danh sách chỉ có một mục, không nhận vơ đó là menu chơi.
          Không tự tạo menu, không sửa tệp game, không giả lập âm thanh.
          Kiểm thử unit và Wine bắt buộc phải thành công trước phát hành.
          Cài đè cùng chữ ký, mở game, sau khi nghe thông báo hãy
          chia sẻ nhật ký công cụ. Đây là bản chẩn đoán, chưa khẳng
          định khôi phục tiếng hoặc menu.
          MENU71_NOTES
          elif grep -q 'versionCode 70' app/app/build.gradle; then
            tag="nvda-audio-aisound-exports-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
            title='Winlator 70: chẩn đoán AISound và resource.irf'
            cat > /tmp/preview-notes.md <<'AISOUND70_NOTES'
          Nhật ký APK 69 và các tệp zetianji.exe, aisound.dll, resource.irf
          cho thấy BASS nhận buffer NULL; không chứng minh được nguyên nhân
          gốc khiến toàn game im tiếng. APK 70 bổ sung nhật ký:
          audio-aisound-modules cho trạng thái DLL và export;
          audio-aisound-call cho lời gọi InitTTS/Speak của aisound.dll
          và aisound_initialize/aisound_speak của resource.irf;
          audio-dynamic khi game tra cứu hai thư viện.
          Wrapper x86 tail-jump giữ nguyên kiểu gọi, tham số và kết quả hàm.
          CI Wine bắt buộc kiểm thử hai DLL giả và giá trị trả về không đổi.
          KHÔNG tự tạo âm thanh và CHƯA phải bản sửa tiếng đã được xác nhận.
          Cài đè bản trước, đóng hoàn toàn Wine, mở game, thực hiện
          các hành động cần phát tiếng, gửi nhật ký công cụ.
          AISOUND70_NOTES
          elif grep -q 'versionCode 69' app/app/build.gradle; then
            tag="nvda-audio-null-source-callsite-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
            title='Winlator 69: chẩn đoán lệnh gọi BASS từ game'
            cat > /tmp/preview-notes.md <<'BASS_NULL69_NOTES'
          Nhật ký APK 68 trên OnePlus đã chứng minh zetianji.exe truyền
          con trỏ NULL và length=0 vào BASS_StreamCreateFile.
          Bản này chỉ ghi thêm 32 byte mã lệnh ngay trước callerRva,
          có giới hạn trong module zetianji.exe và đã kiểm tra vùng nhớ.
          Không tự tạo dữ liệu âm thanh giả, không thay đổi game EXE.
          Kiểm thử Wine bắt buộc kiểm tra mã lệnh tại callsite.
          Cài đè cùng chữ ký, mở game và chia sẻ nhật ký công cụ.
          BASS_NULL69_NOTES
          elif grep -q 'versionCode 68' app/app/build.gradle; then
            tag="nvda-audio-bass-memory-log-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
            title='Winlator 68: ghi nhật ký bộ nhớ BASS đầy đủ'
            cat > /tmp/preview-notes.md <<'MEMORY68_NOTES'
          APK 67 ghi thiếu timeMs trong audio-bass-memory.
          APK 68 sửa lỗi mất bản ghi khi NVDA lọc sự kiện theo thời gian.
          Kiểm thử Wine đọc log qua cùng TraceReader của Android.
          Cài đè APK, mở lại Wine và gửi nhật ký Zetianji để truy vết lỗi.
          MEMORY68_NOTES
          elif grep -q 'versionCode 67' app/app/build.gradle; then
             tag="nvda-audio-bass-wav-memory-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
             title='Winlator 67 thử nghiệm — sửa độ dài luồng WAV trong bộ nhớ'
             cat > /tmp/preview-notes.md <<'AUDIO_BASS_WAV_NOTES'
          Nhật ký APK 66 trên OnePlus xác nhận BASS_StreamCreateFile(memory=true, length=0) lỗi 20.
          APK 67 chỉ sửa length khi dữ liệu có header RIFF/WAVE và kích thước được xác minh
          nằm trong một vùng nhớ đọc được, giới hạn tối đa 16 MiB. Với OGG, MP3, bộ nhớ
          không đọc được hay kích thước bất thường, giữ nguyên lời gọi và kết quả gốc.
          Ghi audio-bass-memory: state, originalLength, candidateLength, usedLength,
          repaired, result, bassError, callerModule và callerRva. Không ghi con trỏ hay PCM.
          Wine fake BASS kiểm thử WAV tự phục hồi và cả đường từ chối an toàn.
          Chưa có chứng cứ game thật đã có tiếng; đây là bản thử có sửa có điều kiện.
          Cài đè APK cùng chữ ký, thoát hoàn toàn Windows, mở Zetianji và chia sẻ nhật ký.
          AUDIO_BASS_WAV_NOTES
           elif grep -q 'versionCode 66' app/app/build.gradle; then
            tag="nvda-audio-bass-errors-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            title='Winlator 66 thử nghiệm — ghi lỗi BASS thật và đầu vào tạo stream'
            cat > /tmp/preview-notes.md <<'AUDIO_BASS_ERRORS_NOTES'
          APK 65 trên OnePlus ghi BASS_StreamCreateFile result=0, không có DSP, nhưng chưa ghi mã lỗi BASS.
          Gói game được cung cấp có bass.dll phiên bản 2.4.9; WASAPI output và cờ BASS_DEVICE_DSOUND chỉ xuất hiện từ 2.4.13.
          Vì vậy việc cờ 0x40000 được trả lại ở bản trước không xác nhận backend đã chuyển.

          APK 66:
          - ghi audio-bass-call cho BASS_Init, BASS_StreamCreateFile và BASS_ChannelPlay;
          - lấy BASS_ErrorGetCode ngay trên luồng gọi sau hàm gốc, trước GetInfo/SetDSP;
          - ghi BASS_GetVersion, flags, offset/length 64 bit, nguồn tệp hay bộ nhớ;
          - với nguồn tệp: ghi đường dẫn Wine đã chuẩn hóa, thư mục làm việc, khả năng mở đọc, kích thước và lỗi kiểm tra tệp;
          - không đọc/lưu nội dung buffer nguồn, PCM hoặc địa chỉ bộ nhớ trong phép đo đầu vào;
          - giữ flags gốc với BASS trước 2.4.13 hoặc phiên bản chưa xác định;
          - backendConfirmed=false: không suy ra backend thật chỉ từ các cờ khởi tạo;
          - giữ renderer DSP, nhưng không gắn DSP khi tạo stream thất bại.

          CI thử hai phiên bản BASS giả lập 2.4.9 và 2.4.18: khởi tạo thành công/lặp lại lỗi 14,
          thiếu tệp ANSI/Unicode lỗi 2, đầu vào bộ nhớ không hợp lệ lỗi 20, handle phát sai lỗi 5,
          rồi stream thành công với DSP nonzero. GetInfo cố ý đổi mã lỗi để kiểm tra đúng thời điểm chụp lỗi.
          Đây là kiểm thử probe, không phải xác nhận game thật đã có tiếng trên OnePlus.

          Cài cập nhật cùng chữ ký, thoát hẳn môi trường cũ rồi mở lại.
          Mở Zetianji, thao tác menu khoảng một phút, sau đó Chia sẻ nhật ký công cụ.
          Không cần cài lại bộ ghi giọng để nhận probe nạp sớm mới; không cần xóa dữ liệu.
          Các dòng quyết định: audio-bass-call, bassVersion, bassError, fileState, path và fileReadable.
          AUDIO_BASS_ERRORS_NOTES
          elif grep -q 'versionCode 65' app/app/build.gradle; then
            tag="nvda-audio-bass-dsp-renderer-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            title='Winlator 65 thử nghiệm — phát PCM đã giải mã của BASS qua renderer riêng'
            cat > /tmp/preview-notes.md <<'AUDIO_BASS_DSP_RENDERER_NOTES'
          Bản THỬ NGHIỆM Winlator 65 chuyển sang đường phát chủ động sau khi APK 64 ép DirectSound vẫn im lặng.

          Log OnePlus APK 64 xác nhận:
          - preload PID chạy thành công trước game audio;
          - BASS_Init nhận requestedFlags=0, wrapper ép 0x40000 và BASS_GetInfo báo lại reportedFlags=0x40000;
          - BASS_Init lần đầu thành công, nên yêu cầu DirectSound đã được BASS chấp nhận;
          - tuy vậy không có DirectSoundCreate, DirectSoundBuffer::Unlock hoặc DirectSoundBuffer::Play;
          - client game FLOATLE stereo 44.1 kHz tiếp tục ghi hơn 10 MB toàn zero.

          APK 65 không chờ backend BASS/WASAPI/DirectSound nữa:
          - bọc BASS_StreamCreateFile mà Zetianji lấy qua GetProcAddress;
          - sau khi stream được tạo, lấy freq/channels/flags bằng BASS_ChannelGetInfo;
          - gắn BASS_ChannelSetDSP trực tiếp vào stream;
          - DSP chỉ đếm metadata cho nhật ký, không lưu PCM;
          - đồng thời copy PCM đã giải mã sang các buffer waveOut riêng của probe;
