name: Check NVDA startup in Wine
on:
  push:
    branches: [codex/accessibility-apk]
    paths: ['runtime-nvda/**', '.github/workflows/nvda-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: app/app/src/main/assets/nvda
          key: nvda-portable-2026.3-a8a87cb8-v1
      - name: Install probe tools
        timeout-minutes: 10
        run: |
          sudo dpkg --add-architecture i386
          sudo sed -i 's/^Architectures: amd64$/Architectures: amd64 i386/' /etc/apt/sources.list.d/ubuntu.sources
          sudo timeout 120s apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends gcc-mingw-w64-x86-64-posix wine64 wine32:i386 xvfb xauth p7zip-full fonts-wine pulseaudio
      - name: Prepare official portable NVDA
        run: |
          python3 runtime-nvda/prepare.py
          python3 runtime-nvda/compat.py
          bash runtime-nvda/build.sh
          python3 runtime-nvda/wfm/build.py
          x86_64-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror -mwindows -static -static-libgcc runtime-nvda/touch-fixture.c -o runtime-nvda/touch-fixture.exe
      - name: Check actual NVDA startup
        run: |
          pulseaudio --start --exit-idle-time=-1
          xvfb-run -a python3 runtime-nvda/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvda-wine-probe
          path: runtime-nvda/probe-results/
          if-no-files-found: ignore
