name: Check NVDA startup in Wine
on:
  push:
    branches: [codex/accessibility-apk]
    paths: ['runtime-nvda/**', '.github/workflows/nvda-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install probe tools
        timeout-minutes: 5
        run: |
          sudo timeout 120s apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends wine64 xvfb xauth p7zip-full fonts-wine pulseaudio
      - name: Prepare official portable NVDA
        run: python3 runtime-nvda/prepare.py
      - name: Check actual NVDA startup
        run: |
          pulseaudio --start --exit-idle-time=-1
          xvfb-run -a python3 runtime-nvda/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvda-wine-probe
          path: runtime-nvda/probe-results/
          if-no-files-found: ignore
