apply plugin: 'com.android.application'

tasks.register('verifyGuestAccessibilityHelper') {
    doLast {
        if (!file('src/main/assets/accessibility/winlator-a11y.exe').isFile()) {
            throw new GradleException('Missing Wine accessibility helper. Run bash runtime-accessibility/build.sh from the repository root first.')
        }
    }
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'verifyGuestAccessibilityHelper' }

tasks.register('verifyNvdaBundle') {
    doLast {
        ['nvda-portable.zip', 'manifest.json', 'NVDA-COPYING.txt', 'nvda-launcher.exe',
         'config-template.ini', 'addon-manifest.ini', 'winlatorStartup.py'].each { name ->
            if (!file('src/main/assets/nvda/' + name).isFile())
                throw new GradleException('Missing NVDA bundle. Run runtime-nvda/prepare.py, compat.py (Python 3.13) and build.sh first.')
        }
    }
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'verifyNvdaBundle' }

android {
    namespace 'com.winlator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.winlator'
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 34
        versionName "11.2-NVDA-preview"
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    signingConfigs {
        debug {
            def previewKeystore = System.getenv('WINLATOR_PREVIEW_KEYSTORE')
            if (previewKeystore) storeFile file(previewKeystore)
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    lintOptions {
        checkReleaseBuilds false
    }

    ndkVersion '24.0.8215888'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
    implementation 'androidx.lifecycle:lifecycle-process:2.5.1'
}
